name: CI

on:
  push:
    branches:
      - main
      - master
      - 'Aria-*'
  pull_request:
  workflow_dispatch:

env:
  STM32_BUILD_CONFIG: Debug
  STM32CUBEIDE_VERSION: 2.1.1

jobs:
  detect-targets:
    name: Detect firmware targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_targets: ${{ steps.detect.outputs.has_targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect affected firmware targets
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: ./scripts/detect-firmware-targets.py

  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    env:
      CI_JOBS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Run host tests
        run: ./scripts/ci_test_host.sh

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run static analysis
        run: ./scripts/ci_static_analysis.sh

  firmware-build:
    name: Firmware build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs:
      - detect-targets
      - host-tests
      - static-analysis
    if: needs.detect-targets.outputs.has_targets == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.detect-targets.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        run: ./scripts/build-cubeide-docker.sh "${{ matrix.target }}" "${{ env.STM32_BUILD_CONFIG }}" "${{ env.STM32CUBEIDE_VERSION }}"

      - name: Package firmware artifacts
        run: ./scripts/package-firmware-artifacts.sh "${{ matrix.target }}" "${{ env.STM32_BUILD_CONFIG }}"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ env.STM32_BUILD_CONFIG }}
          path: build/firmware/${{ matrix.target }}/
          if-no-files-found: error
